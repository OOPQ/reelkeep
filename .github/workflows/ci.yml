name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Go test
        run: go test ./internal/... ./cmd/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/...

  build-cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/reelkeep-$VERSION-$GOOS-$GOARCH$EXT" ./cmd/reelkeep

      - uses: actions/upload-artifact@v4
        with:
          name: reelkeep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Desktop (Windows installer)
    needs: test
    runs-on: windows-latest
    env:
      # 免费方案：SignPath Foundation（开源项目）
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_CONFIG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build desktop shell
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $v = (Get-Content VERSION -Raw).Trim()
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$v" -o reelkeep-desktop.exe ./desktop

      - name: Sign desktop (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host 'No signing certificate configured'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'reelkeep.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 reelkeep-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "sign failed: $LASTEXITCODE" }
          Remove-Item $pfx -Force

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/installer.ps1 -SkipBuild

      - name: Package source ZIP
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tmp = Join-Path $env:RUNNER_TEMP 'reelkeep-sources'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item sources/*.json $tmp -Force
          Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath "dist/reelkeep-sources-$v.zip" -Force

      - name: Sign installer (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host 'No signing certificate configured'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'reelkeep.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $setup = Get-ChildItem dist/Reelkeep-Setup-*.exe | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "sign failed: $LASTEXITCODE" }
          Remove-Item $pfx -Force

      - name: Stage unsigned for SignPath
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path unsigned -Force | Out-Null
          Copy-Item reelkeep-desktop.exe unsigned -Force
          Copy-Item dist/Reelkeep-Setup-*.exe unsigned -Force

      - name: Upload unsigned for SignPath
        if: env.SIGNPATH_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*
          if-no-files-found: error

      - name: Sign with SignPath (free for OSS)
        if: env.SIGNPATH_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace with signed files
        if: env.SIGNPATH_TOKEN != ''
        shell: pwsh
        run: |
          Get-ChildItem signed -Recurse -Filter *.zip | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath signed -Force }
          $exe = Get-ChildItem signed -Recurse -Filter reelkeep-desktop.exe | Select-Object -First 1
          if (-not $exe) { throw 'SignPath output missing executable' }
          Copy-Item $exe.FullName reelkeep-desktop.exe -Force
          $setup = Get-ChildItem signed -Recurse -Filter 'Reelkeep-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'SignPath output missing installer' }
          Copy-Item $setup.FullName dist -Force

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-artifact -Force | Out-Null
          Copy-Item reelkeep-desktop.exe windows-artifact -Force
          Copy-Item dist/Reelkeep-Setup-*.exe windows-artifact -Force
          if (Test-Path dist/reelkeep-sources-*.zip) { Copy-Item dist/reelkeep-sources-*.zip windows-artifact -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: reelkeep-desktop-windows
          path: windows-artifact/*
          if-no-files-found: error

  build-desktop-unix:
    name: Desktop ${{ matrix.artifact }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, artifact: macos-amd64, arch: amd64 }
          - { os: macos-15, artifact: macos-arm64, arch: arm64 }
          - { os: ubuntu-24.04, artifact: linux-amd64, debarch: amd64 }
          - { os: ubuntu-24.04-arm, artifact: linux-arm64, debarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libgtk-4-dev \
            libwebkit2gtk-4.1-dev libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-4.1-dev libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev

      - name: Build desktop
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/reelkeep-desktop ./desktop

      - name: Package tar.gz
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          cd dist
          tar -czf "reelkeep-$VERSION-${{ matrix.artifact }}-desktop.tar.gz" reelkeep-desktop

      - name: Package macOS app + dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          bash scripts/package-macos.sh "$VERSION" "${{ matrix.arch }}" dist/reelkeep-desktop

      - name: Package deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          bash scripts/package-deb.sh "$VERSION" "${{ matrix.debarch }}" dist/reelkeep-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: reelkeep-desktop-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, build-desktop, build-desktop-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums (optional GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
          else
            echo "No GPG key configured"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
